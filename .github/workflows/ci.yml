# Typecheck and test the MCP server against the live Practice Lab on every push, PR and night.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 9 * * *' # daily, 09:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Test (with the HTML report)
        run: npm run test:report
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mcp-report
          path: reports/mcp-report.html
          retention-days: 14
